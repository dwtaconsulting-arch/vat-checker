<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부가세 신고서 점검</title>
<link rel="stylesheet" href="css/app.css">
<!-- 외부 접속 없이 동작: 모든 스크립트는 이 폴더 안에 있음 -->
<script src="js/vendor/pdf.min.js"></script>
<script src="js/vendor/pdf.worker.min.js"></script>
<script src="js/core/money.js"></script>
<script src="js/core/period.js"></script>
<script src="js/core/trace.js"></script>
<script src="js/params/data.js"></script>
<script src="js/core/params.js"></script>
<script src="js/io/pdf-text.js"></script>
<script src="js/io/return-pdf.js"></script>
<script src="js/io/hometax-summary.js"></script>
<script src="js/checks/return-consistency.js"></script>
<script src="js/checks/hometax-compare.js"></script>
<script src="js/ui/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>부가세 신고서 점검</h1>
    <p class="sub">신고서 PDF의 본표 산식과 부속서류 합계가 서로 맞는지, 홈택스 신고자료 통합조회와 맞는지 확인합니다.
      <span class="local">파일은 이 PC의 브라우저 안에서만 읽고, 어디에도 전송하지 않습니다.</span></p>
  </div>
</header>

<main class="wrap">
  <label id="drop" class="drop" tabindex="0">
    <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    <strong>PDF를 여기로 끌어다 놓거나 클릭해서 선택 (여러 개 가능)</strong>
    <span>① 일반과세자 신고서 본표 + 부속서류 PDF &nbsp;② (선택) 홈택스 「부가가치세 신고자료 통합조회」 화면을 PDF로 저장한 파일</span>
  </label>

  <p id="status" class="status" role="status" hidden></p>

  <section id="report" hidden>
    <div class="file-line">
      <h2 id="file-name"></h2>
      <div class="actions">
        <label class="toggle"><input id="only-issues" type="checkbox"> 확인이 필요한 항목만 보기</label>
        <button id="print" type="button">인쇄</button>
      </div>
    </div>

    <p class="sources" id="sources"></p>
    <div class="cards" id="totals"></div>
    <div class="counts" id="counts"></div>
    <p class="forms" id="forms"></p>
    <div id="groups"></div>
  </section>
</main>

<footer class="wrap foot">
  ⚠️ 확인필요 = 다를 수 있지만 사람이 확인할 항목 · ❌ 오류 = 서식상 반드시 같아야 하는데 다른 항목
</footer>
</body>
</html>
